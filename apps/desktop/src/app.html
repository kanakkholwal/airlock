<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script src="%sveltekit.assets%/theme.js"></script>
    <style>
      /* Splash: plain HTML and CSS so it paints before any script runs. The layout removes it once mounted. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: oklch(100% 0 0);
      }
      html.dark,
      html.dark body {
        background: oklch(17% 0.002 265);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: oklch(100% 0 0);
        transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      html.dark #splash {
        background: oklch(17% 0.002 265);
      }
      #splash[data-leaving] {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 96px;
        height: 96px;
        animation: splash-breathe 1.6s ease-in-out infinite;
      }
      @keyframes splash-breathe {
        50% {
          transform: scale(0.96);
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: none;
        }
        #splash {
          transition: none;
        }
      }
    </style>
    <title>Airlock</title>
    %sveltekit.head%
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Airlock">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="splash-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2a2a2e" />
            <stop offset="1" stop-color="#0f0f11" />
          </linearGradient>
        </defs>
        <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#splash-bg)" />
        <path d="M300 790 L512 290 L724 790" fill="none" stroke="#f4f4f5" stroke-width="88" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M410 640 H614" fill="none" stroke="#f4f4f5" stroke-width="72" stroke-linecap="round" />
        <circle cx="512" cy="196" r="46" fill="#ef4444" />
      </svg>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
